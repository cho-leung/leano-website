name: Build anonymized RFQ proof

on:
  push:
    branches:
      - build/anonymized-rfq-proof

permissions:
  contents: write

jobs:
  build-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/anonymized-rfq-proof

      - name: Apply authorized patch
        run: python3 tools/apply_rfq_proof.py

      - name: Run static, syntax, backend, i18n and evidence tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/static_checks.py
          python3 tests/search_discoverability.py
          node --check script.js
          node --check < apps-script/Code.gs
          node --test tests/backend.test.cjs tests/i18n.test.cjs tests/rfq_proof.test.cjs

      - name: Run local browser and locale visual tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/leano-playwright --no-save playwright
          NODE_PATH=/tmp/leano-playwright/node_modules npx --prefix /tmp/leano-playwright playwright install chromium
          node tests/serve.mjs > /tmp/leano-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          NODE_PATH=/tmp/leano-playwright/node_modules LEANO_BROWSER_CHANNEL=chromium node tests/browser.test.cjs
          NODE_PATH=/tmp/leano-playwright/node_modules LEANO_BROWSER_CHANNEL=chromium node tests/locale-visual.test.cjs

      - name: Commit tested changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_rfq_proof.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css script.js tests/search_discoverability.py tests/rfq_proof.test.cjs tools/apply_rfq_proof.py
          git commit -m "Add anonymized real-RFQ proof-of-work section"
          git push origin HEAD:build/anonymized-rfq-proof
