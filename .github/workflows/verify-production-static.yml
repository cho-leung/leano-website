name: Verify production static baseline

on:
  push:
    branches:
      - build/anonymized-rfq-proof

jobs:
  live-static-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run production static identity test against main
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/leano-playwright --no-save playwright
          NODE_PATH=/tmp/leano-playwright/node_modules npx --prefix /tmp/leano-playwright playwright install chromium
          NODE_PATH=/tmp/leano-playwright/node_modules node tests/live-static.test.cjs
