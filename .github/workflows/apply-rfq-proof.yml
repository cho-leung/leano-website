          const test = require('node:test');

          const index = fs.readFileSync('index.html', 'utf8');
          const script = fs.readFileSync('script.js', 'utf8');
          const styles = fs.readFileSync('styles.css', 'utf8');
          const publicSource = `${index}\n${script}\n${styles}`;

          test('selected RFQ work is located between process and audience sections', () => {
            const process = index.indexOf('id="process"');
            const proof = index.indexOf('id="selected-rfq-work"');
            const audience = index.indexOf('audience-section');
            assert.ok(process >= 0 && proof > process && audience > proof);
          });

          test('five-language proof keys and downstream numbering exist', () => {
            for (const key of ['sectionProof', 'proofTitle', 'proofOutcome', 'proofEvidenceNote', 'proofPrinciple4']) {
              assert.equal((script.match(new RegExp(`${key}:`, 'g')) || []).length, 5, `${key} must exist in five locales`);
            }
            for (const number of ['05 /', '06 /', '07 /']) assert.ok(script.includes(number));
          });

          test('evidence boundary explicitly states no completed order/payment/delivery in every locale', () => {
            const phrases = [
              'no purchase order, payment or delivery was completed',
              '没有完成采购订单、付款或交付',
              'aucun bon de commande, paiement ni livraison n’a été finalisé',
              'заказ на покупку, оплата и поставка не были завершены',
              'no se completó ninguna orden de compra, pago ni entrega',
            ];
            for (const phrase of phrases) assert.ok(script.includes(phrase), `missing evidence-boundary phrase: ${phrase}`);
          });

          test('private buyer identity and forbidden exact SKUs are absent from public source', () => {
            const forbidden = [
              'Julius', 'Equilibrium General Supply', 'Cham Towers', 'C7GG7AT#BH5', 'WD162PURX'
            ];
            for (const token of forbidden) assert.ok(!publicSource.toLowerCase().includes(token.toLowerCase()), `private token leaked: ${token}`);
          });

          test('unsupported success claims are absent from the proof section source', () => {
            const proofStart = index.indexOf('id="selected-rfq-work"');
            const proofEnd = index.indexOf('audience-section', proofStart);
            const proofMarkup = index.slice(proofStart, proofEnd).toLowerCase();
            for (const phrase of ['successful project', 'client success', 'trusted by', 'completed procurement', 'we delivered']) {
              assert.ok(!proofMarkup.includes(phrase), `unsupported success claim: ${phrase}`);
            }
          });

          test('RFQ production endpoint remains unchanged', () => {
            assert.ok(script.includes("https://script.google.com/macros/s/AKfycbwny2Lu9DvREl_te12o7_KJxhgXUiwTNAEjWkK9zPImF3g7WevC03nyLt5DZLPNseqq/exec"));
          });
          '''
          (root / 'tests/rfq_proof.test.cjs').write_text(proof_test, encoding='utf-8')

          # ---- search discoverability guard: update accepted hashes for this authorized change ----
          search_test = search_test_path.read_text(encoding='utf-8')
          search_test = search_test.replace("CANONICAL = 'https://cho-leung.github.io/leano-website/'", "CANONICAL = 'https://leanosourcing.com/'")
          search_test = re.sub(r'# Accepted production baseline[^\n]*', '# Accepted baseline after authorized anonymized RFQ proof-of-work update.', search_test, count=1)

          script_hash = hashlib.sha256(script_path.read_bytes()).hexdigest()
          styles_hash = hashlib.sha256(styles_path.read_bytes()).hexdigest()
          body_hash = hashlib.sha256(index_path.read_text(encoding='utf-8').split('<body>', 1)[1].encode()).hexdigest()
          search_test = re.sub(r"'script\.js': '[0-9a-f]{64}'", f"'script.js': '{script_hash}'", search_test, count=1)
          search_test = re.sub(r"'styles\.css': '[0-9a-f]{64}'", f"'styles.css': '{styles_hash}'", search_test, count=1)
          search_test = re.sub(r"BODY_SHA256 = '[0-9a-f]{64}'", f"BODY_SHA256 = '{body_hash}'", search_test, count=1)
          search_test_path.write_text(search_test, encoding='utf-8')
          PY

      - name: Run static, syntax, backend, i18n and evidence tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/static_checks.py
          python3 tests/search_discoverability.py
          node --check script.js
          node --check < apps-script/Code.gs
          node --test tests/backend.test.cjs tests/i18n.test.cjs tests/rfq_proof.test.cjs

      - name: Run local browser and locale visual tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/leano-playwright --no-save playwright@1.56.1
          NODE_PATH=/tmp/leano-playwright/node_modules npx --prefix /tmp/leano-playwright playwright install chromium
          node tests/serve.mjs > /tmp/leano-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          NODE_PATH=/tmp/leano-playwright/node_modules LEANO_BROWSER_CHANNEL=chromium node tests/browser.test.cjs
          NODE_PATH=/tmp/leano-playwright/node_modules LEANO_BROWSER_CHANNEL=chromium node tests/locale-visual.test.cjs

      - name: Commit tested changes to review branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-rfq-proof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css script.js tests/search_discoverability.py tests/rfq_proof.test.cjs .github/workflows/apply-rfq-proof.yml
          git commit -m "Add anonymized real-RFQ proof-of-work section"
          git push origin HEAD:build/anonymized-rfq-proof
