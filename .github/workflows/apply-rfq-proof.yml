          }
          .proof-label {
            margin: 0 0 26px;
            color: var(--accent);
            font-size: 0.64rem;
            font-weight: 700;
            letter-spacing: 0.095em;
            text-transform: uppercase;
          }
          .proof-summary > p:last-child,
          .proof-decision > p:last-child,
          .proof-outcome > p:not(.proof-label) {
            margin: 0;
            font-size: clamp(1.08rem, 1.7vw, 1.48rem);
            line-height: 1.48;
            letter-spacing: -0.022em;
          }
          .proof-actions ul {
            list-style: none;
            margin: 0;
            padding: 0;
            border-top: 1px solid var(--line-strong);
          }
          .proof-actions li {
            position: relative;
            padding: 16px 0 16px 28px;
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.84rem;
            line-height: 1.58;
          }
          .proof-actions li::before {
            content: '→';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: 700;
          }
          .proof-decision {
            background: color-mix(in srgb, var(--sand) 48%, var(--paper));
          }
          .proof-outcome {
            background: color-mix(in srgb, var(--accent-soft) 40%, var(--paper));
          }
          .proof-evidence-note {
            margin-top: 24px !important;
            padding-top: 22px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.82rem !important;
            line-height: 1.62 !important;
            letter-spacing: 0 !important;
          }
          .proof-principles {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            margin-top: clamp(44px, 6vw, 74px);
            border-top: 1px solid var(--line-strong);
            border-bottom: 1px solid var(--line-strong);
          }
          .proof-principles span {
            min-height: 112px;
            display: flex;
            align-items: flex-end;
            padding: 20px 22px 20px 0;
            border-right: 1px solid var(--line);
            font-size: clamp(1rem, 1.55vw, 1.4rem);
            line-height: 1.25;
            letter-spacing: -0.025em;
            font-weight: 520;
          }
          .proof-principles span:not(:first-child) { padding-left: 22px; }
          .proof-principles span:last-child { border-right: 0; }
          .proof-principles span:nth-child(2) { color: var(--blue); }
          .proof-principles span:nth-child(3) { color: var(--terracotta); }
          .proof-principles span:nth-child(4) { color: var(--accent); }

          @media (max-width: 900px) {
            .proof-head { grid-template-columns: 1fr; gap: 24px; }
            .proof-head h2 { max-width: 820px; }
            .proof-head .section-intro { max-width: 620px; }
            .proof-grid { grid-template-columns: 1fr; }
            .proof-principles { grid-template-columns: repeat(2, 1fr); }
            .proof-principles span:nth-child(2) { border-right: 0; }
            .proof-principles span:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
          }

          @media (max-width: 560px) {
            .proof-summary,
            .proof-actions,
            .proof-decision,
            .proof-outcome { padding: 26px 22px; }
            .proof-principles { grid-template-columns: 1fr; }
            .proof-principles span,
            .proof-principles span:not(:first-child) {
              min-height: 86px;
              padding: 18px 0;
              border-right: 0;
              border-bottom: 1px solid var(--line);
            }
            .proof-principles span:last-child { border-bottom: 0; }
          }
          '''
          styles_path.write_text(styles + proof_css, encoding='utf-8')

          # ---- script.js: add five-locale copy through the existing dictionary ----
          script = script_path.read_text(encoding='utf-8')

          locale_blocks = {
            "      sectionAudience: '04 / Who we work with',": """      sectionProof: '04 / Selected RFQ work',
