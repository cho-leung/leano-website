name: Apply anonymized RFQ proof

on:
  push:
    branches:
      - build/anonymized-rfq-proof

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/anonymized-rfq-proof

      - name: Apply authorized website change
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('.')
          index_path = root / 'index.html'
          styles_path = root / 'styles.css'
          script_path = root / 'script.js'
          search_test_path = root / 'tests/search_discoverability.py'

          # ---- index.html: add the real-RFQ proof section before audience ----
          index = index_path.read_text(encoding='utf-8')
          audience_anchor = '    <section class="section audience-section" aria-labelledby="audience-title">'
          if audience_anchor not in index:
              raise SystemExit('Audience anchor not found')

          proof_html = '''    <section class="section proof-section" id="selected-rfq-work" aria-labelledby="proof-title">
              <div class="shell">
                <div class="proof-head reveal">
                  <p class="section-index" data-i18n="sectionProof">04 / Selected RFQ work</p>
                  <h2 id="proof-title" data-i18n-html="proofTitle">Exact-spec sourcing<br>for an overseas project supplier.</h2>
                  <p class="section-intro" data-i18n="proofIntro">This example shows how Leano handled a real RFQ. It does not represent a completed transaction.</p>
                </div>

                <div class="proof-grid">
                  <div class="proof-summary reveal">
                    <p class="proof-label" data-i18n="proofSituationLabel">Situation</p>
                    <p data-i18n="proofSituation">An overseas project supplier brought several live procurement requirements, including an exact-SKU branded computer requirement and a mixed ICT / access-control BOM. Exact specifications mattered more than convenient substitutions.</p>
                  </div>

                  <div class="proof-actions reveal">
                    <p class="proof-label" data-i18n="proofActionsLabel">What Leano did</p>
                    <ul>
                      <li data-i18n="proofAction1">Reviewed exact manufacturer part numbers and quantities.</li>
                      <li data-i18n="proofAction2">Clarified destination and project timing before pricing.</li>
                      <li data-i18n="proofAction3">Checked multiple potential supply routes for exact-spec availability.</li>
                      <li data-i18n="proofAction4">Separated confirmed items from items that still required clarification.</li>
                      <li data-i18n="proofAction5">Refused to silently substitute an exact part number that could not be reliably verified.</li>
                      <li data-i18n="proofAction6">Prepared a working commercial quotation for the verifiable portion of a mixed BOM.</li>
                      <li data-i18n="proofAction7">Stated quote validity, stock-reconfirmation requirements, freight exclusions and warranty limitations.</li>
                    </ul>
                  </div>

                  <aside class="proof-decision reveal">
                    <p class="proof-label" data-i18n="proofDecisionLabel">Decision standard</p>
                    <p data-i18n="proofDecision">When one exact manufacturer part number could not be reliably confirmed through normal supply channels, Leano did not replace it with a similar model and present it as equivalent. The item remained unresolved pending exact-spec confirmation.</p>
                  </aside>

                  <div class="proof-outcome reveal">
                    <p class="proof-label" data-i18n="proofOutcomeLabel">Outcome</p>
                    <p data-i18n="proofOutcome">The sourcing and quotation work reached commercial review, but no purchase order, payment or delivery was completed.</p>
                    <p class="proof-evidence-note" data-i18n="proofEvidenceNote">This example is published to show how Leano handles a real RFQ—not to represent a completed transaction.</p>
                  </div>
                </div>

                <div class="proof-principles reveal" aria-label="What this demonstrates" data-i18n-aria="proofPrinciplesAria">
                  <span data-i18n="proofPrinciple1">Exact requirement first.</span>
                  <span data-i18n="proofPrinciple2">Verified supply before commitment.</span>
                  <span data-i18n="proofPrinciple3">No silent substitutions.</span>
                  <span data-i18n="proofPrinciple4">Commercial uncertainty stated clearly.</span>
                </div>
              </div>
            </section>

          '''
          index = index.replace(audience_anchor, proof_html + audience_anchor, 1)
          index = index.replace('data-i18n="sectionAudience">04 / Who we work with', 'data-i18n="sectionAudience">05 / Who we work with', 1)
          index = index.replace('data-i18n="sectionPrinciple">05 / Operating principle', 'data-i18n="sectionPrinciple">06 / Operating principle', 1)
          index = index.replace('data-i18n="sectionRfq">06 / Send a requirement', 'data-i18n="sectionRfq">07 / Send a requirement', 1)
          index_path.write_text(index, encoding='utf-8')

          # ---- styles.css: extend the existing visual vocabulary only ----
          styles = styles_path.read_text(encoding='utf-8')
          if '.proof-section {' in styles:
              raise SystemExit('Proof styles already exist')
          proof_css = r'''

          /* Real RFQ process evidence */
          .proof-section {
